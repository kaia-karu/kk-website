name: Devlore — baseline capture (draft)

# Reads this repo's existing code to draft a Requirements backfill and a
# baseline master-docs seed, staged in the vault for review — dispatched
# by the setup wizard's opt-in "Analyze existing code" step, right after
# linking. Generated by Devlore's setup wizard, not hand-written.

on:
  workflow_dispatch:

jobs:
  capture-baseline-draft:
    uses: BubbaF377/devlore-workflows/.github/workflows/capture-baseline-draft.yml@main
    with:
      project-name: kk-website
      vault-repo: kaia-karu/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
