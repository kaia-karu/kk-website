name: Devlore — baseline capture (seed)

# Opens a PR seeding this project's first master docs, plus a first
# Onboarding guide, from the baseline draft staged earlier — dispatched
# once the wizard's confirm step has committed the reviewed Requirements
# backfill to docs/PRODUCT.md. Generated by Devlore's setup wizard, not
# hand-written.

on:
  workflow_dispatch:

jobs:
  capture-baseline-seed:
    uses: BubbaF377/devlore-workflows/.github/workflows/capture-baseline-seed.yml@main
    with:
      project-name: kk-website
      vault-repo: kaia-karu/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
